<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySocial - Simple Social Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 600px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .toggle-text {
            text-align: center;
            margin-top: 15px;
            color: #666;
        }

        .toggle-text a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .feed {
            margin-top: 20px;
        }

        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info h3 {
            color: #333;
        }

        .post-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .post-form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            margin-bottom: 10px;
        }

        .post-form textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .posts {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .post-author {
            font-weight: 600;
            color: #667eea;
        }

        .post-time {
            color: #999;
            font-size: 14px;
        }

        .post-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .post-actions {
            display: flex;
            gap: 15px;
        }

        .post-actions button {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 3px;
            transition: background 0.3s;
        }

        .post-actions button:hover {
            background: #e8eaf6;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #3c3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 MySocial</h1>
            <p>Connect with friends and share your thoughts</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="auth-form">
            <h2>Login</h2>
            <div id="loginError" class="error hidden"></div>
            <div class="input-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="btn btn-primary" onclick="login()">Login</button>
            <div class="toggle-text">
                Don't have an account? <a onclick="toggleForms()">Sign up</a>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="auth-form hidden">
            <h2>Sign Up</h2>
            <div id="signupError" class="error hidden"></div>
            <div id="signupSuccess" class="success hidden"></div>
            <div class="input-group">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username">
            </div>
            <div class="input-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="Choose a password">
            </div>
            <div class="input-group">
                <label for="signupConfirmPassword">Confirm Password</label>
                <input type="password" id="signupConfirmPassword" placeholder="Confirm your password">
            </div>
            <button class="btn btn-primary" onclick="signup()">Sign Up</button>
            <div class="toggle-text">
                Already have an account? <a onclick="toggleForms()">Login</a>
            </div>
        </div>

        <!-- Main Feed (Hidden by default) -->
        <div id="mainFeed" class="hidden">
            <div class="user-info">
                <h3>Welcome, <span id="currentUser"></span>!</h3>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>

            <div class="post-form">
                <h3>Share something...</h3>
                <textarea id="postContent" placeholder="What's on your mind?"></textarea>
                <button class="btn btn-primary" onclick="createPost()">Post</button>
            </div>

            <div class="posts" id="postsContainer">
                <!-- Posts will be dynamically added here -->
            </div>
        </div>
    </div>

    <script>
        // Simple in-memory database (localStorage for persistence)
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let posts = JSON.parse(localStorage.getItem('posts')) || [];
        let currentUser = null;

        // Toggle between login and signup forms
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('signupForm').classList.toggle('hidden');
            clearErrors();
        }

        // Clear all error messages
        function clearErrors() {
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('signupError').classList.add('hidden');
            document.getElementById('signupSuccess').classList.add('hidden');
        }

        // Show error message
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }

        // Show success message
        function showSuccess(elementId, message) {
            const successElement = document.getElementById(elementId);
            successElement.textContent = message;
            successElement.classList.remove('hidden');
        }

        // Signup function
        function signup() {
            clearErrors();
            
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            // Validation
            if (!username || !email || !password || !confirmPassword) {
                showError('signupError', 'All fields are required!');
                return;
            }

            if (username.length < 3) {
                showError('signupError', 'Username must be at least 3 characters!');
                return;
            }

            if (password.length < 6) {
                showError('signupError', 'Password must be at least 6 characters!');
                return;
            }

            if (password !== confirmPassword) {
                showError('signupError', 'Passwords do not match!');
                return;
            }

            // Check if username already exists
            if (users.find(user => user.username === username)) {
                showError('signupError', 'Username already exists!');
                return;
            }

            // Check if email already exists
            if (users.find(user => user.email === email)) {
                showError('signupError', 'Email already registered!');
                return;
            }

            // Create new user
            const newUser = {
                id: Date.now(),
                username: username,
                email: email,
                password: password, // In real app, this should be hashed!
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            showSuccess('signupSuccess', 'Account created successfully! You can now login.');
            
            // Clear form
            document.getElementById('signupUsername').value = '';
            document.getElementById('signupEmail').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupConfirmPassword').value = '';

            // Switch to login after 2 seconds
            setTimeout(() => {
                toggleForms();
            }, 2000);
        }

        // Login function
        function login() {
            clearErrors();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('loginError', 'Please enter both username and password!');
                return;
            }

            // Find user
            const user = users.find(u => u.username === username && u.password === password);

            if (!user) {
                showError('loginError', 'Invalid username or password!');
                return;
            }

            // Login successful
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));

            // Show feed
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('mainFeed').classList.remove('hidden');
            document.getElementById('currentUser').textContent = user.username;

            // Load posts
            loadPosts();
        }

        // Logout function
        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            
            document.getElementById('mainFeed').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            
            // Clear form
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        // Create post
        function createPost() {
            const content = document.getElementById('postContent').value.trim();

            if (!content) {
                alert('Please write something before posting!');
                return;
            }

            const newPost = {
                id: Date.now(),
                userId: currentUser.id,
                username: currentUser.username,
                content: content,
                likes: 0,
                createdAt: new Date().toISOString()
            };

            posts.unshift(newPost); // Add to beginning
            localStorage.setItem('posts', JSON.stringify(posts));

            // Clear textarea
            document.getElementById('postContent').value = '';

            // Reload posts
            loadPosts();
        }

        // Load posts
        function loadPosts() {
            const postsContainer = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                postsContainer.innerHTML = '<p style="text-align: center; color: #999;">No posts yet. Be the first to post!</p>';
                return;
            }

            postsContainer.innerHTML = posts.map(post => {
                const postDate = new Date(post.createdAt);
                const timeAgo = getTimeAgo(postDate);

                return `
                    <div class="post">
                        <div class="post-header">
                            <span class="post-author">@${post.username}</span>
                            <span class="post-time">${timeAgo}</span>
                        </div>
                        <div class="post-content">${post.content}</div>
                        <div class="post-actions">
                            <button onclick="likePost(${post.id})">❤️ Like (${post.likes})</button>
                            ${post.userId === currentUser.id ? `<button onclick="deletePost(${post.id})">🗑️ Delete</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Like post
        function likePost(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.likes++;
                localStorage.setItem('posts', JSON.stringify(posts));
                loadPosts();
            }
        }

        // Delete post
        function deletePost(postId) {
            if (confirm('Are you sure you want to delete this post?')) {
                posts = posts.filter(p => p.id !== postId);
                localStorage.setItem('posts', JSON.stringify(posts));
                loadPosts();
            }
        }

        // Get time ago
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' minutes ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
            return Math.floor(seconds / 86400) + ' days ago';
        }

        // Check if user is already logged in
        window.onload = function() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('mainFeed').classList.remove('hidden');
                document.getElementById('currentUser').textContent = currentUser.username;
                loadPosts();
            }
        };
    </script>
</body>
</html>
